appId: org.forrt.reprocrowd
productName: ReproCrowd
copyright: ReproCrowd (FORRT)
publish:
  provider: github
  owner: forrtproject
  repo: reprocrowd-app
directories:
  output: dist
  buildResources: resources
files:
  - package.json
  - build/main/**
  - build/preload/**
  - build/renderer/**
  - "!build/backend/**"
extraResources:
  - from: build/backend
    to: backend
  - from: resources/hex-sticker.png
    to: hex-sticker.png
  - from: resources/examples
    to: examples
asarUnpack: []
# Electron fuses (#91): the packaged app can't be turned into a plain Node.js runtime (ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS) or made to load code from outside its checked app.asar. --inspect stays on for now: the Playwright
# e2e test drives the packaged build through it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Setting fuses changes the binary; unsigned macOS builds need their ad-hoc signature redone or Apple Silicon kills them.
  resetAdHocDarwinSignature: true
linux:
  syncDesktopName: true
  target: [AppImage, dir]
  category: Science
  icon: resources/hex-sticker.png
  synopsis: Crowdsourcing AI reproductions
  description: AI-assisted computational reproductions of scholarly papers, deposited on Zenodo.
mac:
  target: [dmg]
  category: public.app-category.education
win:
  target: [nsis]
  artifactName: ${productName}-${version}-setup.${ext}
