name: Contracts and offline workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: uv sync --project backend --python 3.13 --locked
      - run: npm run test:contracts
      - run: npm run build
      - run: uv run --project backend reprocrowd-schemas check backend
      - run: uv run --project backend pytest backend/tests -q
      - run: npm run test:providers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: provider-conformance-report
          path: test-output/providers/
          retention-days: 14
          if-no-files-found: ignore
