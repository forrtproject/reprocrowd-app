name: Release

# Build ReproCrowd for Windows, Linux and macOS and attach the installers to a GitHub Release. Installed copies look
# for updates there (src/main/updater.ts):
#   Windows  ReproCrowd-<version>-setup.exe + latest.yml        installs itself (electron-updater)
#   Linux    ReproCrowd-<version>.AppImage  + latest-linux.yml  replaces itself (electron-updater)
#   macOS    ReproCrowd-<version>-arm64.dmg                     unsigned: the app points users to the download
# Trigger: push a tag v<version> matching package.json's version (e.g. v0.2.0), or run it by hand from the Actions
# tab (builds only; no release).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job, which runs no third-party build code, can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win nsis
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            builder: --linux AppImage
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
          - os: macos-latest
            builder: --mac dmg
            files: |
              dist/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag matches package.json's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="$(node -p 'require("./package.json").version')"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $want; installed copies would never see this update."; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build renderer / main / preload
        run: npm run build

      - name: Bundle the backend
        run: npm run bundle-backend

      - name: Build the installer
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificates (yet)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reprocrowd-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installing

            The installers aren't code-signed yet, so Windows and macOS warn before the first start.

            - **Windows** (`ReproCrowd-<version>-setup.exe`): if SmartScreen says "Windows protected your PC", click
              **More info → Run anyway**. Later updates install themselves.
            - **macOS** (`ReproCrowd-<version>-arm64.dmg`, Apple silicon only): drag ReproCrowd to Applications and open
              it. If macOS refuses, open **System Settings → Privacy & Security** and click **Open Anyway**. If it says
              the app "is damaged and can't be opened", run `xattr -cr /Applications/ReproCrowd.app` in Terminal and
              open it again. The app tells you about updates; download them from this page.
            - **Linux** (`ReproCrowd-<version>.AppImage`): `chmod +x ReproCrowd-*.AppImage` and run it. Later updates
              install themselves.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.dmg
