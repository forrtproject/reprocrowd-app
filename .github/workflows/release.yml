name: Release

# Build ReproCrowd for Windows, Linux and macOS and attach the installers to a GitHub Release. Installed copies look
# for updates there (src/main/updater.ts):
#   Windows  ReproCrowd-<version>-setup.exe + latest.yml        installs itself (electron-updater)
#   Linux    ReproCrowd-<version>.AppImage  + latest-linux.yml  replaces itself (electron-updater)
#   macOS    ReproCrowd-<version>-arm64.dmg                     unsigned: the app points users to the download
# Each build is started and checked with test/smoke.mjs: the app opens, its bundled backend answers, and quitting
# leaves no backend behind.
# Triggers:
#   - push a tag v<version> matching package.json's version (e.g. v0.2.0): build, smoke test, release
#   - add the label "build-all" to a pull request: build and smoke test now and on each later push
#   - run it by hand from the Actions tab: build and smoke test the chosen branch (no release)

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

# A newer push to the same pull request cancels the older run; tag and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the release job, which runs no third-party build code, can write.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'build-all')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win nsis
            files: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
          - os: ubuntu-latest
            builder: --linux AppImage
            files: |
              dist/*.AppImage
              dist/latest-linux.yml
          - os: macos-latest
            builder: --mac dir # signed below, then packed into the dmg
            files: |
              dist/*.dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: The tag matches package.json's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="$(node -p 'require("./package.json").version')"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $want; installed copies would never see this update."; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build renderer / main / preload
        run: npm run build

      - name: Bundle the backend
        run: npm run bundle-backend

      - name: Build the installer
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificates (yet)

      # macOS: signed with an Apple Development certificate (free Xcode Personal Team), so every release has the same
      # Team ID and updates may go on reading the app's keychain item without asking (scripts/sign-mac.sh). Pull-request
      # builds never see the certificate and stay ad-hoc signed; a release must not.
      - name: Sign the app (macOS)
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGNING_P12_BASE64" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The macOS signing certificate (secret MAC_SIGNING_P12_BASE64) is missing. An unsigned release would make Mac users allow keychain access again after every update."
              exit 1
            fi
            echo "::warning::No macOS signing certificate: this build stays ad-hoc signed."
            exit 0
          fi
          scripts/sign-mac.sh dist/mac-arm64/ReproCrowd.app

      - name: Build the dmg (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg --arm64 --prepackaged dist/mac-arm64/ReproCrowd.app --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Ubuntu 24.04 blocks the user namespaces Chromium's sandbox needs.
      - name: Allow Electron's sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke test the unpacked app
        shell: bash
        env:
          SMOKE_LABEL: unpacked
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node test/smoke.mjs; else node test/smoke.mjs; fi

      # The same check on the copy users get: installed by the NSIS installer, copied out of the dmg, or the AppImage.
      - name: Smoke test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMOKE_LABEL: installed
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter ReproCrowd.exe | Select-Object -First 1
          if (-not $exe) { throw "The installer didn't put ReproCrowd.exe under $env:LOCALAPPDATA\Programs" }
          node test/smoke.mjs $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test the installed app (macOS)
        if: runner.os == 'macOS'
        env:
          SMOKE_LABEL: installed
        run: |
          hdiutil attach dist/*.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          ditto "$RUNNER_TEMP/dmg/ReproCrowd.app" "$RUNNER_TEMP/Applications/ReproCrowd.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          node test/smoke.mjs "$RUNNER_TEMP/Applications/ReproCrowd.app/Contents/MacOS/ReproCrowd"

      - name: Smoke test the installed app (Linux AppImage)
        if: runner.os == 'Linux'
        env:
          SMOKE_LABEL: installed
        run: |
          sudo apt-get install -y libfuse2t64 # AppImages mount themselves with FUSE 2
          chmod +x dist/*.AppImage
          xvfb-run -a node test/smoke.mjs dist/*.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-screens-${{ runner.os }}
          path: test-output/smoke-*.png
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reprocrowd-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 90 }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installing

            The installers aren't code-signed yet, so Windows and macOS warn before the first start.

            - **Windows** (`ReproCrowd-<version>-setup.exe`): if SmartScreen says "Windows protected your PC", click
              **More info → Run anyway**. Later updates install themselves.
            - **macOS** (`ReproCrowd-<version>-arm64.dmg`, Apple silicon only): drag ReproCrowd to Applications and open
              it. If macOS refuses, open **System Settings → Privacy & Security** and click **Open Anyway**. If it says
              the app "is damaged and can't be opened", run `xattr -cr /Applications/ReproCrowd.app` in Terminal and
              open it again. If macOS asks for your login password so ReproCrowd can use "ReproCrowd Safe Storage",
              enter it and click **Always Allow**; later updates won't ask again. The app tells you about updates;
              download them from this page.
            - **Linux** (`ReproCrowd-<version>.AppImage`): `chmod +x ReproCrowd-*.AppImage` and run it. Later updates
              install themselves.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.dmg
