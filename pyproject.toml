[project]
name = "metareader"
version = "0.1.0"
description = "REST service and CLI for building computational-reproducibility packages for papers"
readme = "README.md"
authors = [
    { name = "Luna Fazio", email = "bmfaziol@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "frictionless>=5.21.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.3",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mr = "metareader.cli:main"
mr-schemas = "metareader.schemas.export:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
